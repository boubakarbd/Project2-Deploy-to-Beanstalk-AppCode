name: "Java App CI/CD (OIDC + SonarCloud + AWS CLI)"

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # --- 1. SÉCURITÉ : TRIVY ---
      - name: Run Trivy Security Scan 🛡️
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-app-results.sarif'

      - name: Upload Trivy results to GitHub 📤
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-app-results.sarif'

      # --- 2. CONFIGURATION JAVA ---
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # --- 3. BUILD, TESTS & JACOCO ---
      #  générer le rapport de couverture JaCoCo.
      - name: Build and Test with Maven ☕
        run: mvn clean verify

      # --- 4. ANALYSE QUALITÉ : SONARCLOUD ---
      - name: SonarCloud Scan ☁️
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app-war
          path: target/*.war

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-scan
    env:
      # Noms des ressources définis dans ton main.tf 
      EB_APP_NAME: "project2-beanstalk-application"
      EB_ENV_NAME: "project2-beanstalk-environment"
      S3_BUCKET: "project-2-app-code-bucket-unique-name-2026-01" 

    steps:
    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: java-app-war
        path: ./deploy-package

    - name: Configure AWS Credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: us-east-1

    - name: Deploy via AWS CLI 🚀
      run: |
        # 1. Identification du fichier .war
        WAR_FILE=$(ls deploy-package/*.war)
        VERSION_LABEL="deploy-${{ github.run_id }}-${{ github.sha }}"
        S3_KEY="versions/${VERSION_LABEL}.war"

        echo "🚀 Déploiement de la version : $VERSION_LABEL"

        # 2. Upload vers le bucket S3 d'artefacts 
        aws s3 cp "$WAR_FILE" "s3://${{ env.S3_BUCKET }}/${S3_KEY}"

        # 3. Création de la version Beanstalk
        aws elasticbeanstalk create-application-version \
          --application-name "${{ env.EB_APP_NAME }}" \
          --version-label "$VERSION_LABEL" \
          --description "Commit ${{ github.sha }}" \
          --source-bundle S3Bucket="${{ env.S3_BUCKET }}",S3Key="${S3_KEY}"

        # 4. Mise à jour de l'environnement
        aws elasticbeanstalk update-environment \
          --application-name "${{ env.EB_APP_NAME }}" \
          --environment-name "${{ env.EB_ENV_NAME }}" \
          --version-label "$VERSION_LABEL"

        # 5. Attente de la stabilisation
        echo "⏳ Attente de la mise à jour..."
        aws elasticbeanstalk wait environment-updated \
          --application-name "${{ env.EB_APP_NAME }}" \
          --environment-name "${{ env.EB_ENV_NAME }}"
        
        echo "✅ Déploiement terminé !"
