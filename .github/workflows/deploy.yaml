name: "Java App CI/CD (OIDC + AWS CLI)"

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- SCAN DE SÉCURITÉ ---
      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-app-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-app-results.sarif'

      # --- BUILD MAVEN ---
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app-war
          path: target/*.war

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-scan
    env:
      # Variables basées sur ton main.tf
      EB_APP_NAME: "project2-beanstalk-application"
      EB_ENV_NAME: "project2-beanstalk-environment"
      # Bucket créé dans ton Terraform
      S3_BUCKET: "project-2-app-code-bucket-unique-name-2026-01" 

    steps:
    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: java-app-war
        path: ./deploy-package

    - name: Configure AWS Credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: us-east-1

    - name: Deploy via AWS CLI
      run: |
        # 1. Identification du fichier .war (le nom peut varier selon ta version Maven)
        WAR_FILE=$(ls deploy-package/*.war)
        VERSION_LABEL="deploy-${{ github.run_id }}-${{ github.sha }}"
        S3_KEY="versions/${VERSION_LABEL}.war"

        echo "🚀 Début du déploiement de la version : $VERSION_LABEL"

        # 2. Upload du fichier vers ton bucket S3 d'artefacts
        aws s3 cp "$WAR_FILE" "s3://${{ env.S3_BUCKET }}/${S3_KEY}"

        # 3. Création d'une nouvelle version d'application Beanstalk
        aws elasticbeanstalk create-application-version \
          --application-name "${{ env.EB_APP_NAME }}" \
          --version-label "$VERSION_LABEL" \
          --description "Commit ${{ github.sha }}" \
          --source-bundle S3Bucket="${{ env.S3_BUCKET }}",S3Key="${S3_KEY}"

        # 4. Mise à jour de l'environnement vers cette nouvelle version
        aws elasticbeanstalk update-environment \
          --application-name "${{ env.EB_APP_NAME }}" \
          --environment-name "${{ env.EB_ENV_NAME }}" \
          --version-label "$VERSION_LABEL"

        # 5. Attente de la fin du déploiement (Healthy status)
        echo "⏳ Attente de la mise à jour de l'environnement..."
        aws elasticbeanstalk wait environment-updated \
          --application-name "${{ env.EB_APP_NAME }}" \
          --environment-name "${{ env.EB_ENV_NAME }}"
        
        echo "✅ Déploiement terminé avec succès !"
